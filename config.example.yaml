# Chatbot Bridge Configuration Example
# Copy this file to config.yaml and customize for your needs

# Required: Root directory for allowed file operations
project_root: "./workspace"

# Optional: Directory to store browser sessions (default: ./sessions)
sessions_dir: "./sessions"

# Optional: Directory to store log files (default: ./logs)
logs_dir: "./logs"

# Browser Settings
# Run browser in headless mode (default: false for better stealth)
headless: false

# Custom user agent (leave null for random)
user_agent: null

# Monitoring Settings
# Min and max milliseconds between message checks (default: [500, 2000])
check_interval_range: [500, 2000]

# Execution Settings
# Maximum execution time for code in seconds (default: 30)
execution_timeout: 30

# Maximum memory usage per execution in MB (default: 512)
memory_limit_mb: 512

# Maximum CPU usage per execution in percent (default: 50)
cpu_limit_percent: 50

# Human Behavior Settings
# Min and max milliseconds between keystrokes (default: [50, 150])
typing_delay_range: [50, 150]

# Probability of typing error 0.0-1.0 (default: 0.02 = 2%)
typo_rate: 0.02

# Min and max milliseconds for random pauses (default: [500, 3000])
pause_range: [500, 3000]

# Min and max milliseconds before responding (default: [1000, 5000])
response_delay_range: [1000, 5000]

# CAPTCHA Settings
# 2captcha API key (leave null for manual resolution)
captcha_api_key: null

# Maximum time to wait for CAPTCHA solution in seconds (default: 120)
captcha_timeout: 120

# Proxy Settings
# List of proxy URLs (leave empty for no proxies)
proxies: []
# Example:
# proxies:
#   - "http://proxy1.example.com:8080"
#   - "socks5://user:pass@proxy2.example.com:1080"

# Min and max requests before proxy rotation (default: [10, 20])
proxy_rotation_interval: [10, 20]

# Error Handling Settings
# Maximum retry attempts for failed operations (default: 3)
max_retries: 3

# Exponential backoff multiplier for retries (default: 2.0)
retry_backoff_factor: 2.0

# Backoff multiplier when rate limited (default: 2.0)
rate_limit_backoff_factor: 2.0
